# http://www.gradle.org/docs/current/userguide/build_environment.html

# C?u hình JVM cho Gradle Daemon (t?i ?u cho máy 16GB RAM)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.workers.max=2

# Tách ti?n trình R8/D8 riêng và dùng ch? ?? t??ng thích ?? tránh tràn native memory
android.enableR8.fullMode=false
android.r8.integratedOptimization=false

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Gi?m dung l??ng class R khi biên d?ch
android.nonTransitiveRClass=true